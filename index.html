<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface-2:    #21262d;
      --border:       #30363d;
      --text:         #e6edf3;
      --muted:        #8b949e;
      --accent:       #58a6ff;
      --green:        #3fb950;
      --green-dim:    rgba(63,185,80,.13);
      --green-ring:   rgba(63,185,80,.38);
      --yellow:       #d4a017;
      --yellow-dim:   rgba(212,160,23,.13);
      --yellow-ring:  rgba(212,160,23,.38);
      --gray-dim:     rgba(139,148,158,.07);
      --gray-ring:    rgba(139,148,158,.22);
      --r:  14px;
      --rs:  10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px 16px 48px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 440px; margin: 0 auto; }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 24px 0 30px;
    }
    .icon {
      font-size: 42px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 18px rgba(88,166,255,.35));
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 5px; }

    /* ── Mode toggle ── */
    .mode-wrap {
      position: relative;
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 4px;
      margin-bottom: 16px;
    }
    .mode-pill {
      position: absolute;
      inset: 4px auto 4px 4px;
      width: calc(50% - 4px);
      background: var(--surface-2);
      border-radius: 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,.45);
      transition: transform .24s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .mode-pill.right { transform: translateX(100%); }
    .mode-btn {
      position: relative; z-index: 1;
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 12px 10px;
      font-size: 14px; font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      transition: color .18s;
      white-space: nowrap;
    }
    .mode-btn.active { color: var(--text); font-weight: 600; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card-lbl {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Time input */
    .time-box {
      position: relative;
    }
    input[type="time"] {
      display: block; width: 100%;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--rs);
      color: var(--text);
      font-size: 40px; font-weight: 700;
      padding: 12px 16px;
      text-align: center;
      letter-spacing: 3px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color .18s;
    }
    input[type="time"]:focus { outline: none; border-color: var(--accent); }
    input[type="time"]::-webkit-calendar-picker-indicator {
      cursor: pointer; filter: invert(.55) brightness(1.4);
    }

    /* Now display */
    .now-box { text-align: center; padding: 6px 0 2px; }
    .now-time {
      font-size: 54px; font-weight: 700;
      letter-spacing: -2px; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .now-hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

    /* Slider */
    .sl-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 16px;
    }
    .sl-val {
      font-size: 22px; font-weight: 700; color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .sl-val em { font-size: 13px; font-weight: 400; color: var(--muted); font-style: normal; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%; height: 5px;
      border-radius: 3px;
      outline: none; cursor: pointer;
      background: var(--surface-2); /* updated via JS */
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(88,166,255,.18);
      transition: box-shadow .15s, transform .12s;
      cursor: pointer;
    }
    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.12);
      box-shadow: 0 0 0 7px rgba(88,166,255,.22);
    }
    input[type="range"]::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
    }
    .sl-limits {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--muted); margin-top: 8px;
    }

    /* Results header */
    .res-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .res-lbl {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--muted);
    }

    /* Format toggle */
    .fmt-wrap {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px; gap: 2px;
    }
    .fmt-btn {
      background: transparent; border: none;
      color: var(--muted);
      padding: 5px 12px; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all .15s;
    }
    .fmt-btn.active { background: var(--surface-2); color: var(--text); }

    /* Result cards */
    .res-card {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border-radius: var(--r); border: 1px solid var(--border);
      margin-bottom: 10px;
      transition: opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .res-card.green  { background: var(--green-dim);  border-color: var(--green-ring); }
    .res-card.yellow { background: var(--yellow-dim); border-color: var(--yellow-ring); }
    .res-card.gray   { background: var(--gray-dim);   border-color: var(--gray-ring); opacity: .72; }

    .cyc-badge {
      flex-shrink: 0;
      width: 50px; height: 50px; border-radius: 13px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
    }
    .green  .cyc-badge { background: rgba(63,185,80,.2);   color: var(--green); }
    .yellow .cyc-badge { background: rgba(212,160,23,.2);  color: var(--yellow); }
    .gray   .cyc-badge { background: rgba(139,148,158,.13); color: var(--muted); }

    .cyc-n    { font-size: 22px; font-weight: 800; line-height: 1; }
    .cyc-txt  { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; opacity: .8; }

    .res-body { flex: 1; min-width: 0; }
    .res-time {
      font-size: 30px; font-weight: 700;
      letter-spacing: -.5px; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .res-dur  { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .res-tag  { font-size: 11px; font-weight: 600; margin-top: 4px; }
    .green  .res-tag { color: var(--green); }
    .yellow .res-tag { color: var(--yellow); }
    .gray   .res-tag { color: var(--muted); }

    .cp-btn {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer; color: var(--muted);
      transition: border-color .18s, color .18s;
      -webkit-tap-highlight-color: transparent;
    }
    .cp-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cp-btn.ok    { border-color: var(--green);  color: var(--green); }

    footer {
      text-align: center; padding-top: 30px;
      font-size: 12px; color: var(--muted); opacity: .45; line-height: 1.7;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="icon">🌙</span>
    <h1>Sleep Calculator</h1>
    <p class="sub">Wake up between cycles, not during them</p>
  </header>

  <!-- Mode toggle -->
  <div class="mode-wrap">
    <div class="mode-pill" id="pill"></div>
    <button class="mode-btn active" id="wakeBtn" onclick="setMode('wake')">⏰ Wake up at…</button>
    <button class="mode-btn"        id="nowBtn"  onclick="setMode('now')">😴 Sleeping now</button>
  </div>

  <!-- Wake-up-at input -->
  <div class="card" id="wakeCard">
    <div class="card-lbl">I want to wake up at</div>
    <div class="time-box">
      <input type="time" id="wakeInput" value="07:00" oninput="calc()">
    </div>
  </div>

  <!-- Sleeping-now display -->
  <div class="card hidden" id="nowCard">
    <div class="card-lbl">Falling asleep now</div>
    <div class="now-box">
      <div class="now-time" id="nowTime">--:--</div>
      <div class="now-hint">Calculating wake-up times from now</div>
    </div>
  </div>

  <!-- Cycle-length slider -->
  <div class="card">
    <div class="sl-head">
      <div class="card-lbl">Sleep cycle length</div>
      <div class="sl-val" id="slVal">90 <em>min</em></div>
    </div>
    <input type="range" id="slider" min="70" max="120" value="90" oninput="onSlide(this.value)">
    <div class="sl-limits"><span>70 min</span><span>120 min</span></div>
  </div>

  <!-- Results -->
  <div class="res-row">
    <div class="res-lbl">Recommended times</div>
    <div class="fmt-wrap">
      <button class="fmt-btn active" id="btn12" onclick="setFmt(12)">12h</button>
      <button class="fmt-btn"        id="btn24" onclick="setFmt(24)">24h</button>
    </div>
  </div>

  <div id="results"></div>

  <footer>Sleep cycles ~90 min &nbsp;·&nbsp; +14 min to fall asleep</footer>

</div>

<script>
  const ONSET = 14;
  const CYCLE_COUNTS = [6, 5, 4, 3];

  let mode     = 'wake';
  let cycleMins = 90;
  let fmt      = 12;
  let ticker   = null;
  let lastMin  = -1;

  /* ─── SVG icons ─── */
  const SVG_COPY = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  const SVG_CHK  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  /* ─── Mode ─── */
  function setMode(m) {
    mode = m;
    document.getElementById('wakeBtn').classList.toggle('active', m === 'wake');
    document.getElementById('nowBtn').classList.toggle('active',  m === 'now');
    document.getElementById('pill').classList.toggle('right', m === 'now');
    document.getElementById('wakeCard').classList.toggle('hidden', m !== 'wake');
    document.getElementById('nowCard').classList.toggle('hidden',  m !== 'now');
    if (m === 'now') startTicker(); else stopTicker();
    calc();
  }

  function startTicker() {
    stopTicker();
    tick();
    ticker = setInterval(tick, 1000);
  }
  function stopTicker() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }
  function tick() {
    const now = new Date();
    document.getElementById('nowTime').textContent = fmtTime(now);
    const m = now.getMinutes();
    if (m !== lastMin) { lastMin = m; calc(); }
  }

  /* ─── Slider ─── */
  function onSlide(v) {
    cycleMins = +v;
    document.getElementById('slVal').innerHTML = `${v} <em>min</em>`;
    fillSlider();
    calc();
  }
  function fillSlider() {
    const pct = ((cycleMins - 70) / 50) * 100;
    document.getElementById('slider').style.background =
      `linear-gradient(to right,#58a6ff ${pct}%,#21262d ${pct}%)`;
  }

  /* ─── Format ─── */
  function setFmt(f) {
    fmt = f;
    document.getElementById('btn12').classList.toggle('active', f === 12);
    document.getElementById('btn24').classList.toggle('active', f === 24);
    if (mode === 'now') document.getElementById('nowTime').textContent = fmtTime(new Date());
    calc();
  }
  function fmtTime(date) {
    const H = date.getHours(), M = date.getMinutes();
    const mm = String(M).padStart(2,'0');
    if (fmt === 24) return `${String(H).padStart(2,'0')}:${mm}`;
    const h = H % 12 || 12;
    return `${h}:${mm} ${H >= 12 ? 'PM' : 'AM'}`;
  }
  function fmtDur(mins) {
    const h = Math.floor(mins / 60), m = mins % 60;
    if (!h) return `${m}m`;
    if (!m) return `${h}h`;
    return `${h}h ${m}m`;
  }

  /* ─── Calculate & render ─── */
  function colorOf(c) { return c >= 5 ? 'green' : c === 4 ? 'yellow' : 'gray'; }
  function tagOf(c) {
    return c === 6 ? '✦ Ideal' : c === 5 ? '✓ Great' : c === 4 ? '~ Minimum' : '✗ Too short';
  }

  function calc() {
    const el = document.getElementById('results');
    let base; // minutes from midnight

    if (mode === 'wake') {
      const v = document.getElementById('wakeInput').value;
      if (!v) { el.innerHTML = ''; return; }
      const [h, m] = v.split(':').map(Number);
      base = h * 60 + m;
    } else {
      const n = new Date();
      base = n.getHours() * 60 + n.getMinutes();
    }

    el.innerHTML = CYCLE_COUNTS.map(c => {
      const total = c * cycleMins + ONSET;
      const raw   = mode === 'wake'
        ? ((base - total) % 1440 + 1440) % 1440
        : (base + total) % 1440;
      const d = new Date();
      d.setHours(Math.floor(raw / 60), raw % 60, 0, 0);
      const timeStr = fmtTime(d);
      const cls = colorOf(c);
      return `
        <div class="res-card ${cls}">
          <div class="cyc-badge">
            <span class="cyc-n">${c}</span>
            <span class="cyc-txt">cycles</span>
          </div>
          <div class="res-body">
            <div class="res-time">${timeStr}</div>
            <div class="res-dur">${fmtDur(total)} of sleep</div>
            <div class="res-tag">${tagOf(c)}</div>
          </div>
          <button class="cp-btn" data-t="${timeStr}" onclick="doCopy(this)" aria-label="Copy time">
            ${SVG_COPY}
          </button>
        </div>`;
    }).join('');
  }

  /* ─── Copy ─── */
  function doCopy(btn) {
    const text = btn.dataset.t;
    const ok = () => {
      btn.classList.add('ok');
      btn.innerHTML = SVG_CHK;
      setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = SVG_COPY; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(() => legacyCopy(text, ok));
    } else {
      legacyCopy(text, ok);
    }
  }
  function legacyCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); cb(); } catch(e) {}
    document.body.removeChild(ta);
  }

  /* ─── Init ─── */
  fillSlider();
  calc();
</script>
</body>
</html>
